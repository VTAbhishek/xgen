name: Deploy to server

# Auto-deploy එක off කරලා. දැන් live එකට යන්නේ අතින් run කළොත් විතරයි:
# GitHub → Actions → "Deploy to server" → Run workflow.
# (ආයෙත් auto ඕන නම් පහත push block එකේ comment අයින් කරන්න.)
on:
  # push:
  #   branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Repo එක checkout කරගන්නවා
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- FRONTEND (React) build ----------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      # ---------- Deploy BACKEND (Laravel) via FTPS ----------
      # vendor එක server එකේ දැනටමත් තියෙනවා -> exclude කරලා (packages වෙනස් වුණාම විතරයි නැවත ඕන)
      # .env, storage overwrite/delete වෙන්නේ නෑ
      - name: Deploy backend
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          timeout: 120000
          local-dir: ./backend/
          # FTP account root = ituneslanka.coderootsolutions.com/ (domain root).
          # Live Laravel එක තියෙන්නේ laravel/ folder එකේ (laravel.php එකෙන් load වෙනවා).
          server-dir: /laravel/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            vendor/**
            .env
            .env.*
            storage/**
            artisan.zip

      # ---------- Deploy FRONTEND (built dist) via FTPS ----------
      - name: Deploy frontend
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          timeout: 120000
          local-dir: ./frontend/dist/
          # Live site එක domain root එකෙන්ම serve වෙනවා.
          server-dir: /
          # .htaccess යවන්නේ නෑ: root එකේ තියෙන live .htaccess එකේ /api, /sanctum
          # laravel.php එකට යවන rules තියෙනවා. frontend/public/.htaccess එකෙන්
          # ඒක overwrite වුණොත් API එක කැඩෙනවා. Cache rules ඕන නම් live එකට අතින් එකතු කරන්න.
          exclude: |
            **/.git*
            **/.git*/**
            .htaccess
